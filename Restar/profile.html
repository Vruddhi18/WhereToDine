    <!-- Header -->

    <!-- Profile Section -->

                <div class="profile-actions">

                    </button>
                </div>
            </div>

            <div class="stat-row">

                    <div>
                        <div class="stat-num" id="favCount">0</div>

                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-bookmark"></i></div>
                    <div>
                        <div class="stat-num" id="visitCount">0</div>
                        <div class="stat-label">Visit later</div>
                    </div>

            </div>

            <div class="section-block">
                <div class="section-block-head">

            <div class="section-block">

    <!-- Footer -->

    <!-- JavaScript -->
    <script src="assets/js/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/jquery.datetimepicker.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/ScrollToPlugin.min.js"></script>
    <script src="assets/js/ScrollSmoother.min.js"></script>
    <script src="assets/js/SplitText.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/server.js"></script>
    <script>
        function renderCafeList(containerId, indexes, cafes, removeUrl, emptyText) {
            const list = document.getElementById(containerId);
            list.innerHTML = "";

            if (!indexes || indexes.length === 0) {
                list.outerHTML = `<div class="empty-state" id="${containerId}">${emptyText}</div>`;
                return;
            }

            indexes.forEach(cafeIndex => {
                const cafe = cafes.find(c => c.Index == cafeIndex);
                if (!cafe) return;
                const card = document.createElement("div");
                card.className = "cafe-chip-card";
                card.innerHTML = `
                    <a href="cafe-details.html?index=${cafeIndex}"><i class="fa-solid fa-store" style="color:var(--theme-color);margin-right:8px;"></i>${cafe.name}</a>
                    <button class="cafe-remove-btn" data-index="${cafeIndex}" aria-label="Remove"><i class="fa-solid fa-xmark"></i></button>
                `;
                list.appendChild(card);
            });
        }

        function wireRemoveButtons(containerId, endpoint, token) {
            document.querySelectorAll(`#${containerId} .cafe-remove-btn`).forEach(button => {
                button.addEventListener("click", function () {
                    const cafeIndex = this.getAttribute("data-index");
                    fetch(`https://where-to-dine.vercel.app/${endpoint}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                        body: JSON.stringify({ cafeIndex })
                    })
                    .then(response => response.json())
                    .then(() => {
                        this.closest(".cafe-chip-card").remove();
                    })
                    .catch(error => console.error("Error:", error));
                });
            });
        }

        document.addEventListener("DOMContentLoaded", async function () {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("https://where-to-dine.vercel.app/profile", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const data = await response.json();
                if (!response.ok) {
                    window.location.href = "login.html";
                    return;
                }

                document.getElementById("username").innerText = data.username || "Your profile";
                document.getElementById("email").innerText = data.email || "";
                const initial = (data.username || "U").trim().charAt(0).toUpperCase();
                document.getElementById("avatarInitial").innerText = initial || "U";

                // Favorites
                fetch("https://where-to-dine.vercel.app/get-favorites", {
                    headers: { "Authorization": `Bearer ${token}` }
                })
                .then(r => r.json())
                .then(favoritesData => {
                    const favorites = favoritesData.favorites || [];
                    document.getElementById("favCount").innerText = favorites.length;
                    fetch("cafe_with_image.json")
                        .then(r => r.json())
                        .then(cafes => {
                            renderCafeList("favorites-list", favorites, cafes, "update-favorites", "No favorites added yet — explore cafes and tap the heart icon to save them here.");
                            wireRemoveButtons("favorites-list", "update-favorites", token);
                        });
                })
                .catch(error => console.error("Error fetching favorites:", error));

                // Visit later
                fetch("https://where-to-dine.vercel.app/get-visit-later", {
                    headers: { Authorization: `Bearer ${token}` }
                })
                .then(r => r.json())
                .then(visitLaterData => {
                    const visitLater = visitLaterData.visit_later || [];
                    document.getElementById("visitCount").innerText = visitLater.length;
                    fetch("cafe_with_image.json")
                        .then(r => r.json())
                        .then(cafes => {
                            renderCafeList("visit-later-list", visitLater, cafes, "update-visit-later", "No cafes added yet — save a place to visit later from the cafe page.");
                            wireRemoveButtons("visit-later-list", "update-visit-later", token);
                        });
                })
                .catch(error => console.error("Error fetching visit later list:", error));

            } catch (error) {
                console.error("Error fetching profile:", error);
            }

            document.getElementById("logoutButton").addEventListener("click", function() {
                localStorage.removeItem("token");
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
